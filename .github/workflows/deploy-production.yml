name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA image tag to build and deploy
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      - name: Resolve deployment ref
        id: deploy-ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.deploy-ref.outputs.sha }}
          persist-credentials: false

      - name: Set image names
        run: |
          set -euo pipefail
          OWNER_LC="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SHA="${{ steps.deploy-ref.outputs.sha }}"
          echo "FRONTEND_IMAGE=${REGISTRY}/${OWNER_LC}/personal-management-frontend:${SHA}" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=${REGISTRY}/${OWNER_LC}/personal-management-backend:${SHA}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE_LATEST=${REGISTRY}/${OWNER_LC}/personal-management-frontend:latest" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE_LATEST=${REGISTRY}/${OWNER_LC}/personal-management-backend:latest" >> "$GITHUB_ENV"

      - name: Validate production configuration
        run: |
          set -euo pipefail
          required=(
            "VITE_API_URL"
            "VITE_FIREBASE_API_KEY"
            "VITE_FIREBASE_AUTH_DOMAIN"
            "VITE_FIREBASE_PROJECT_ID"
            "VITE_FIREBASE_STORAGE_BUCKET"
            "VITE_FIREBASE_MESSAGING_SENDER_ID"
            "VITE_FIREBASE_APP_ID"
            "FIREBASE_PROJECT_ID"
            "CORS_ALLOWED_ORIGIN_PATTERNS"
            "SUPABASE_DB_URL"
            "SUPABASE_DB_USERNAME"
            "SUPABASE_DB_PASSWORD"
            "VPS_HOST"
            "VPS_PORT"
            "VPS_USER"
            "VPS_SSH_KEY"
          )
          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required in the production environment"
              missing=1
            fi
          done
          exit "$missing"
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          CORS_ALLOWED_ORIGIN_PATTERNS: ${{ vars.CORS_ALLOWED_ORIGIN_PATTERNS }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_USERNAME: ${{ secrets.SUPABASE_DB_USERNAME }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}
            ${{ env.BACKEND_IMAGE_LATEST }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}
            ${{ env.FRONTEND_IMAGE_LATEST }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Prepare deployment files
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

          umask 077
          cat > /tmp/personal-management.env <<ENV_FILE
          FRONTEND_IMAGE=${FRONTEND_IMAGE}
          BACKEND_IMAGE=${BACKEND_IMAGE}
          FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
          CORS_ALLOWED_ORIGIN_PATTERNS=${CORS_ALLOWED_ORIGIN_PATTERNS}
          SUPABASE_DB_URL=${SUPABASE_DB_URL}
          SUPABASE_DB_USERNAME=${SUPABASE_DB_USERNAME}
          SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
          JPA_DDL_AUTO=validate
          ENV_FILE
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          CORS_ALLOWED_ORIGIN_PATTERNS: ${{ vars.CORS_ALLOWED_ORIGIN_PATTERNS }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_USERNAME: ${{ secrets.SUPABASE_DB_USERNAME }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Upload production files
        run: |
          set -euo pipefail
          APP_DIR="${{ vars.VPS_APP_DIR || '/opt/personal-management' }}"
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p '$APP_DIR'"
          scp -i ~/.ssh/deploy_key -P "${{ secrets.VPS_PORT }}" docker-compose.prod.yml "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$APP_DIR/docker-compose.prod.yml"
          scp -i ~/.ssh/deploy_key -P "${{ secrets.VPS_PORT }}" /tmp/personal-management.env "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$APP_DIR/.env.production"

      - name: Deploy on VPS
        run: |
          set -euo pipefail
          APP_DIR="${{ vars.VPS_APP_DIR || '/opt/personal-management' }}"
          HEALTH_URL="${{ vars.HEALTHCHECK_URL || 'http://127.0.0.1:3000/actuator/health' }}"
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            APP_DIR="$APP_DIR" HEALTH_URL="$HEALTH_URL" bash -s <<'EOF'
          set -euo pipefail
          cd "$APP_DIR"

          docker compose --env-file .env.production -f docker-compose.prod.yml pull
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans

          for attempt in {1..30}; do
            if curl -fsS "$HEALTH_URL" >/tmp/personal-management-health.json; then
              docker compose --env-file .env.production -f docker-compose.prod.yml ps
              exit 0
            fi
            sleep 5
          done

          docker compose --env-file .env.production -f docker-compose.prod.yml ps
          docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=200
          exit 1
          EOF
