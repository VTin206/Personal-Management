spring.datasource.url=${CI_DATABASE_URL:jdbc:h2:mem:personal_management_ci;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driver-class-name=${CI_DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${CI_DATABASE_USERNAME:sa}
spring.datasource.password=${CI_DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
