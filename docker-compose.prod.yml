services:
  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      SUPABASE_DB_USERNAME: ${SUPABASE_DB_USERNAME}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
